<style>
:root{
  --ink:#1B2B3A; --foam:#EAF1EF; --paper:#F9FBFA; --sea:#0C7F7C;
  --bloom:#B8326E; --stone:#5B6A70; --rule:#D3DEDB;
  --serif:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --sans:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--bloom);outline-offset:2px}
a{color:var(--sea)}

/* Hero */
.hero{background:var(--ink);color:var(--foam)}
.hero .wrap{padding:calc(30px + env(safe-area-inset-top)) 20px 22px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:2.15rem;line-height:1.06;margin:0 0 8px;letter-spacing:-.01em}
.hero .tagline{font-family:var(--serif);font-style:italic;margin:0 0 4px;opacity:.78}
.hero .dates{margin:0 0 18px;font-size:.9rem;opacity:.78}
.route{font-size:.82rem;line-height:2.1;color:#C4D4D0;margin:0}
.city{white-space:nowrap}
.leg{display:inline-block;width:20px;border-top:2px solid currentColor;vertical-align:middle;margin:0 6px;opacity:.75}
.leg.sea{border-top-style:dashed}
.leg.car{border-top-style:dotted;border-top-width:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.72rem;color:#9FB3AE;margin:6px 0 0}
.legend .leg{margin-left:0}

.status{margin-top:20px;padding-top:16px;border-top:1px solid rgba(234,241,239,.18);display:grid;grid-template-columns:10px 1fr;gap:0 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bloom);margin-top:8px;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,50,110,.7)}70%{box-shadow:0 0 0 10px rgba(184,50,110,0)}100%{box-shadow:0 0 0 0 rgba(184,50,110,0)}}
.s1{margin:0;font-weight:600}
.s2{margin:2px 0 10px;font-size:.92rem;opacity:.85}
.s-btn{font-size:.85rem;font-weight:500;border-bottom:1px solid rgba(234,241,239,.5);padding:2px 0}

/* Tabs */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--ink);z-index:10}
.tabs{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex}
.tab{flex:1;padding:14px 4px 12px;font-size:.88rem;font-weight:500;color:var(--stone);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
main .wrap{padding:0 20px calc(48px + env(safe-area-inset-bottom))}
section[hidden]{display:none}

/* Day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:16px 20px 12px;margin:0 -20px;scrollbar-width:none;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 52px;padding:8px 0 7px;border:1px solid var(--rule);border-radius:10px;text-align:center;background:#fff;position:relative}
.chip .wd{display:block;font-size:.68rem;color:var(--stone)}
.chip .n{display:block;font-family:var(--serif);font-size:1.35rem;line-height:1.1;font-weight:500}
.chip .f{display:block;font-size:.8rem;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--foam)}
.chip[aria-pressed="true"] .wd{color:#B9CBC7}
.chip.today::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--bloom)}

/* Day view */
.day{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dow{margin:10px 0 0;font-size:.9rem;color:var(--stone)}
.today-tag{color:var(--bloom);font-weight:600}
.day h2{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1.1;margin:2px 0 6px}
.droute{margin:0 0 14px;font-size:.88rem;color:var(--stone)}
.sleep{margin:0 0 14px;font-size:.88rem}
.sleep b{font-weight:600}
.notes{list-style:none;margin:0 0 18px;padding:0}
.notes li{font-size:.85rem;padding:8px 12px;border-left:3px solid var(--sea);background:#EEF5F3;margin-bottom:6px}
.notes li.warn{border-left-color:var(--bloom);background:#F8EDF2}
.notes b{font-weight:600}

.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.it:last-child{border-bottom:1px solid var(--rule)}
.it .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:1px}
.it .t.soft{font-weight:400;font-style:italic;font-size:.8rem;color:var(--stone);line-height:1.3;padding-top:3px}
.kind{display:block;font-size:.72rem;font-weight:600;color:var(--sea);margin-bottom:1px}
.txt{margin:0}
.sub{margin:3px 0 0;font-size:.85rem;color:var(--stone)}
.ok{margin:5px 0 0;font-size:.8rem;font-weight:500;color:var(--sea)}
.code{margin:6px 0 0;font-size:.8rem;color:var(--stone)}
.code b{user-select:all;-webkit-user-select:all;color:var(--ink);font-weight:600;letter-spacing:.02em;background:#EEF5F3;padding:1px 6px;border-radius:4px}
.it.opt .txt{font-style:italic;color:var(--stone)}
.it.next{background:linear-gradient(90deg,rgba(184,50,110,.07),transparent 70%);margin:0 -20px;padding-left:20px;padding-right:20px;box-shadow:inset 3px 0 0 var(--bloom)}
.it.next .t{color:var(--bloom)}

.daynav{display:flex;justify-content:space-between;margin-top:20px}
.daynav button{font-size:.88rem;font-weight:500;padding:10px 0;color:var(--sea)}
.daynav button:disabled{visibility:hidden}

/* Lists (transporte, hotéis, reservas) */
.sec-title{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:24px 0 4px}
.sec-intro{margin:0 0 12px;font-size:.88rem;color:var(--stone)}
.row{padding:14px 0;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.meta{margin:0 0 6px;font-size:.8rem;color:var(--stone)}
.meta b{color:var(--sea);font-weight:600}
.span{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:6px}
.span .end{text-align:right}
.span strong{display:block;font-family:var(--serif);font-weight:500;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.span small{display:block;font-size:.8rem;color:var(--stone);line-height:1.3}
.span .leg{width:100%;margin:0;color:var(--stone)}
.warn-line{margin:8px 0 0;font-size:.8rem;color:var(--bloom)}

.hotel{display:grid;grid-template-columns:56px 1fr;gap:14px}
.nights{text-align:center}
.nights b{display:block;font-family:var(--serif);font-weight:500;font-size:2.4rem;line-height:1}
.nights span{font-size:.72rem;color:var(--stone)}
.hotel h3,.res h3{margin:0;font-size:1rem;font-weight:600;line-height:1.3}
.p{margin:2px 0 0;font-size:.88rem}
.small{margin:2px 0 0;font-size:.82rem;color:var(--stone)}
.maplink{display:inline-block;margin-top:6px;font-size:.85rem;font-weight:500}

.foot{font-size:.78rem;color:var(--stone);margin:28px 0 0}

@media (min-width:600px){.hero h1{font-size:2.6rem}}
@media (prefers-reduced-motion:reduce){.dot,.day{animation:none}.strip{scroll-behavior:auto}}
</style>
</head>

const LEGCLASS = {air:"", sea:" sea", car:" car"};

const $ = s => document.querySelector(s);
const toDate = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const localKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const cap = s => s[0].toUpperCase()+s.slice(1);
const isTime = t => /^\d{2}:\d{2}$/.test(t);
const mins = t => +t.slice(0,2)*60 + +t.slice(3);
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const leg = k => `<i class="leg${LEGCLASS[k]||""}" aria-hidden="true"></i>`;
const routeHTML = r => r.map(([c,k]) => `<span class="city">${c}</span>${k ? leg(k) : ""}`).join("");

let selected = 0, todayIdx = -1, nextRef = null;

/* Hero route */
$("#route").innerHTML = routeHTML([
  ["Fortaleza","air"],["Paris","air"],["Bucareste","air"],["Corfu","sea"],["Saranda","car"],
  ["Jale","car"],["Saranda","sea"],["Corfu","air"],["Praga","air"],["Paris","air"],["Fortaleza"]
]);

/* Status */
function computeStatus(){
  const now = new Date(), key = localKey(now), last = DAYS.length-1;
  todayIdx = DAYS.findIndex(d => d.date === key);
  nextRef = null;
  let s1, s2, target;
  if (key < DAYS[0].date){
    const diff = Math.round((toDate(DAYS[0].date) - toDate(key)) / 864e5);
    s1 = `Faltam ${diff} dia${diff>1?"s":""} para o embarque`;
    s2 = "Primeiro voo: AF 415, dia 10 às 19:55, saindo de Fortaleza.";
    target = 0;
  } else if (key > DAYS[last].date){
    s1 = "Viagem concluída";
    s2 = "O roteiro continua aqui para consulta.";
    target = last;
  } else {
    const d = DAYS[todayIdx], m = now.getHours()*60 + now.getMinutes();
    s1 = `Hoje é o dia ${todayIdx+1} de ${DAYS.length}: ${d.title}`;
    const i = d.items.findIndex(it => isTime(it.t) && mins(it.t) > m);
    if (i > -1){
      nextRef = [todayIdx, i];
      s2 = `A seguir, ${d.items[i].t}: ${d.items[i].txt}`;
    } else if (todayIdx < last){
      const nd = DAYS[todayIdx+1], ni = nd.items.find(it => isTime(it.t));
      s2 = `Amanhã, ${ni.t}: ${ni.txt}`;
    } else {
      s2 = "Os compromissos de hoje já passaram. Boa chegada em casa.";
    }
    target = todayIdx;
  }
  $("#status").innerHTML = `<span class="dot" aria-hidden="true"></span><div><p class="s1">${s1}</p><p class="s2">${s2}</p><button class="s-btn" id="goToday">Abrir o dia no roteiro</button></div>`;
  $("#goToday").onclick = () => { showTab("roteiro"); selectDay(target, true); document.querySelector(".tabs").scrollIntoView({behavior:"smooth"}); };
  return target;
}

/* Strip */
function renderStrip(){
  $("#strip").innerHTML = DAYS.map((d,i) => {
    const dt = toDate(d.date);
    return `<button class="chip${i===todayIdx?" today":""}" data-i="${i}" aria-pressed="${i===selected}" aria-label="${cap(WD[dt.getDay()])}, ${dt.getDate()} de setembro: ${d.title}">
      <span class="wd">${WDS[dt.getDay()]}</span><span class="n">${dt.getDate()}</span><span class="f">${d.flag}</span></button>`;
  }).join("");
  $("#strip").querySelectorAll(".chip").forEach(b => b.onclick = () => selectDay(+b.dataset.i, true));
}

function selectDay(i, scrollStrip){
  selected = i;
  $("#strip").querySelectorAll(".chip").forEach((b,j) => b.setAttribute("aria-pressed", j===i));
  if (scrollStrip){
    const strip = $("#strip"), chip = strip.children[i];
    strip.scrollLeft = chip.offsetLeft - strip.clientWidth/2 + chip.clientWidth/2;
  }
  renderDay(i);
}

/* Day view */
function renderDay(i){
  const d = DAYS[i], dt = toDate(d.date);
  const notes = d.notes.length ? `<ul class="notes">${d.notes.map(n =>
    `<li class="${n.k}"><b>${n.k==="tz"?"Fuso: ":"Atenção: "}</b>${n.txt}</li>`).join("")}</ul>` : "";
  const items = d.items.map((it,j) => {
    const isNext = nextRef && nextRef[0]===i && nextRef[1]===j;
    const label = it.lab || KIND[it.k];
    return `<li class="it${it.opt?" opt":""}${isNext?" next":""}">
      <div class="t${isTime(it.t)?"":" soft"}">${it.t}</div>
      <div>
        ${label ? `<span class="kind">${label}</span>` : ""}
        <p class="txt">${it.txt}</p>
        ${it.sub ? `<p class="sub">${it.sub}</p>` : ""}
        ${it.ok ? `<p class="ok">✓ ${it.ok}</p>` : ""}
        ${it.code ? `<p class="code">${it.code[0]}: <b>${it.code[1]}</b></p>` : ""}
      </div></li>`;
  }).join("");
  $("#dayview").innerHTML = `<article class="day">
    <p class="dow">${cap(WD[dt.getDay()])}, ${dt.getDate()} de setembro${i===todayIdx?' <span class="today-tag">hoje</span>':""}</p>
    <h2>${d.title}</h2>
    <p class="droute">${routeHTML(d.route)}</p>
    ${d.sleep ? `<p class="sleep">Pernoite: <b>${d.sleep}</b></p>` : ""}
    ${notes}
    <ol class="tl">${items}</ol>
    <div class="daynav">
      <button id="prev" ${i===0?"disabled":""}>Dia anterior</button>
      <button id="next" ${i===DAYS.length-1?"disabled":""}>Próximo dia</button>
    </div></article>`;
  $("#prev").onclick = () => selectDay(i-1, true);
  $("#next").onclick = () => selectDay(i+1, true);
}

/* Transporte */
function renderTransport(){
  const rows = LEGS.map(l => {
    const dt = toDate(l.d);
    return `<article class="row">
      <p class="meta">${cap(WDS[dt.getDay()])}, ${String(dt.getDate()).padStart(2,"0")}/09 <b>${KIND[l.k]} ${l.id}</b></p>
      <div class="span">
        <div><strong>${l.dep}</strong><small>${l.from}</small></div>
        ${leg(l.k)}
        <div class="end"><strong>${l.arr}${l.plus?"<sup>+1</sup>":""}</strong><small>${l.to}</small></div>
      </div>
      ${l.warn ? `<p class="warn-line">${l.warn}</p>` : ""}
    </article>`;
  }).join("");
  $("#transporte").innerHTML = `
    <h2 class="sec-title">Voos e ferries</h2>
    <p class="sec-intro">Partida à esquerda, chegada à direita, no horário local.</p>
    ${rows}
    <h2 class="sec-title">Carro na Albânia</h2>
    <article class="row">
      <h3 style="margin:0;font-size:1rem;font-weight:600">Sixt, balcão do Sarandë Porto</h3>
      <p class="p">Audi Q2</p>
      <p class="small">Retirada no domingo, 13/09, e devolução na quarta, 16/09, às 14h.</p>
    </article>`;
}

/* Hotéis */
function renderHotels(){
  $("#hoteis").innerHTML = `
    <h2 class="sec-title">Hotéis</h2>
    <p class="sec-intro">Nove noites em cinco hotéis, todas as reservas confirmadas.</p>
    ${HOTELS.map(h => `<article class="row hotel">
      <div class="nights"><b>${h.n}</b><span>${h.n>1?"noites":"noite"}</span></div>
      <div>
        <h3>${h.name}</h3>
        <p class="p">${h.city}, ${h.range}</p>
        <p class="small">Check-in ${h.ci}, checkout ${h.co}</p>
        <p class="small">${h.addr}</p>
        <a class="maplink" href="${mapUrl(h.name+", "+h.addr)}" target="_blank" rel="noopener">Abrir no mapa</a>
      </div></article>`).join("")}`;
}

/* Reservas */
function renderReservations(){
  $("#reservas").innerHTML = `
    <h2 class="sec-title">Restaurantes</h2>
    <p class="sec-intro">Reservas confirmadas para o grupo.</p>
    ${MEALS.map(r => `<article class="row res">
      <h3>${r.name}</h3>
      <p class="p">${r.when}</p>
      <p class="small">${r.who}</p>
      <a class="maplink" href="${mapUrl(r.name+", "+r.addr)}" target="_blank" rel="noopener">Abrir no mapa</a>
    </article>`).join("")}`;
}

/* Tabs */
function showTab(name){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab===name));
  ["roteiro","transporte","hoteis","reservas"].forEach(id => $("#"+id).hidden = id!==name);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showTab(t.dataset.tab));

/* Init */
selected = computeStatus();
renderStrip();
selectDay(selected, true);
renderTransport();
renderHotels();
renderReservations();

setInterval(() => {
  const keep = selected;
  computeStatus();
  renderStrip();
  selectDay(keep, false);
}, 60000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
